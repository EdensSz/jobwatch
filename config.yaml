# ---------- Agrégateurs (vue globale : toutes les entreprises qui publient à HK / Singapour / Tokyo) ----------
# Ils cherchent par MÉTIER (role_terms ci-dessous), pas par ville. Les doublons avec les sites des entreprises sont retirés.
# MyCareersFuture (Singapour) et JobsDB (Hong Kong) / JobStreet (Singapour) : sans clé.
# Jooble, Adzuna, Careerjet : clés gratuites à mettre dans les secrets GitHub (sinon ignorés).

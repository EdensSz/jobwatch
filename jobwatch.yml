name: jobwatch
on:
  schedule: [{cron: "0 6,10,14,18 * * *"}]   # 07h 11h 15h 19h heure de Paris (hiver, UTC+1)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python jobwatch.py --explain
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Sauvegarde état + flux
        run: |
          git config user.name "jobwatch"; git config user.email "jobwatch@users.noreply.github.com"
          git add state.json out/ || true
          git diff --cached --quiet || (git commit -m "jobwatch: mise à jour" && git push)

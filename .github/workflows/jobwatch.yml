name: jobwatch
on:
  schedule: [{cron: "0 6,10,14,18 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python jobwatch.py --explain
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Sauvegarde
        run: |
          git config user.name "jobwatch"; git config user.email "jobwatch@users.noreply.github.com"
          git add state.json out/ || true
          git diff --cached --quiet || (git commit -m "jobwatch: mise à jour" && git push)

# ---------- Profil de recherche ----------
locations: ["Hong Kong", "Singapore"]     # Tokyo : ajoute "Tokyo" (pour VIE / postes anglophones)
max_years: 3                               # rejette si > 3 ans d'expérience demandés
min_score: 3                               # monte à 5 si trop de bruit
exclude_languages: ["chinois", "japonais", "coréen", "thaï", "vietnamien", "indonésien"]
reject_highly_preferred: false             # true : rejette aussi « Mandarin highly preferred »
max_age_days: 45
max_description_fetches_per_source: 150

# Mots-clés : on cherche par ville (les sites font une recherche « tous les mots »), les filtres jugent ensuite chaque offre
search_terms:
  - "Hong Kong"
  - "Singapore"

# ---------- Sources ----------

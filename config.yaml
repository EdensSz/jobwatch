# ---------- Profil de recherche ----------
locations: ["Hong Kong", "Singapore", "Tokyo"]
max_years: 3                               # rejette si > 3 ans d'expérience demandés
# Langues : toute langue autre que français / anglais « requise » ou « fortement souhaitée » = offre exclue.
# Une langue seulement « souhaitée / un plus » : offre gardée, note -1, et masquée par le filtre de base de la page.
reject_preferred_languages: false          # true : exclut aussi les offres où une autre langue est juste « un plus »
max_age_days: 60
max_description_fetches_per_source: 400    # lecture de l'annonce complète (plafond par site et par passage)
refresh_days: 7                            # une offre déjà analysée est relue au bout de 7 jours

# Mots-clés : on cherche par ville (les sites font une recherche « tous les mots »), les règles jugent ensuite chaque offre
search_terms:
  - "Hong Kong"
  - "Singapore"
  - "Tokyo"
  - "Japan"

# ---------- IA (gratuite) ----------
# Ordre d'essai : Gemini (clé gratuite Google AI Studio, ~500 analyses/jour) puis OpenRouter (modèles :free, ~50/jour
# sans crédit). Mets la ou les clés dans GitHub > Settings > Secrets : GEMINI_API_KEY, OPENROUTER_API_KEY.
ai:
  enabled: true
  # false = rapide : GitHub ne fait que les règles (langue exigée -> exclue, métier / niveau en lien avec toi),
  # sans IA. Tu lances l'IA toi-même depuis la page (bouton « Réanalyser » sur une offre ou sur la liste).
  # true = l'IA note chaque nouvelle offre pendant le passage (plus lent).
  auto_score: false
  providers: ["gemini", "openrouter", "groq"]
  gemini_model: "gemini-3.5-flash-lite"            # repli automatique sur gemini-3.1-flash-lite
  openrouter_models:                               # le 1er qui répond est utilisé (vérifiés le 17/11/2026)
    - "nvidia/nemotron-3.5-super-vl:free"
    - "nvidia/nemotron-3-ultra-550b-a55b:free"
    - "cohere/north-mini-code:free"
  max_per_run: {gemini: 100, openrouter: 12, groq: 60}
  pause_seconds: {gemini: 4.5, openrouter: 3.5, groq: 2.5}


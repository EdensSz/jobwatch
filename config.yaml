  - {name: "MyCareersFuture (Singapour)", type: mycareersfuture}
  - {name: "JobsDB (Hong Kong)",          type: seek, host: "hk.jobsdb.com", site_key: "HK-Main", city: "Hong Kong"}
  - {name: "JobStreet (Singapour)",       type: seek, host: "sg.jobstreet.com", site_key: "SG-Main", city: "Singapore"}
  - {name: "Jooble",                      type: jooble}
  - {name: "Adzuna (Singapour)",          type: adzuna, country: "sg"}
  - {name: "Careerjet",                   type: careerjet}

